<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página não encontrada · Murim Login</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c1112">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' rx='10' fill='%23c8412c'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='%23f7e9e2' font-family='serif'%3E%E6%AD%A6%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#0c1112;--bone:#ece7da;--txt:#cbc9bd;--mut:#8e9a94;--seal:#c8412c;--seal-hi:#e2593f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse 70% 120% at 78% 0%,#1d2c2b,transparent 70%),var(--ink);color:var(--txt);font:16px/1.6 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;text-align:center}
.seal{display:inline-grid;place-items:center;width:84px;height:84px;margin-bottom:18px;background:var(--seal);color:#f7e9e2;border-radius:6px;font:800 2.4rem/1 "Shippori Mincho","Noto Serif CJK JP",Georgia,serif;transform:rotate(4deg);box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 5px #f7e9e255}
h1{margin:0 0 8px;font:800 clamp(2rem,8vw,3rem)/1.05 "Shippori Mincho","Noto Serif CJK JP",Georgia,serif;color:var(--bone)}
p{margin:0 0 22px;color:var(--mut)}
a.btn{display:inline-block;padding:11px 22px;border-radius:4px;background:var(--seal);color:#fff4ee;font-weight:600;text-decoration:none}
a.btn:hover{background:var(--seal-hi)}
a.btn:focus-visible{outline:2px solid var(--seal-hi);outline-offset:3px}
nav{margin-top:18px;font-size:.92rem}
nav a{color:#a9c2ba;margin:0 8px}
</style>
</head>
<body>
<main>
<div class="seal" aria-hidden="true">武</div>
<h1>Página não encontrada</h1>
<p>Este caminho não existe no Murim Login. Talvez o link esteja errado ou tenha mudado.</p>
<a class="btn" id="home" href="/">Voltar ao início</a>
<nav aria-label="Atalhos"><a class="sc" href="#">Destinos</a><a class="sc" href="#sistema">Sistema</a><a class="sc" href="#materiais">Materiais</a></nav>
</main>
<script>
(function(){var h=location.hostname,seg=location.pathname.split('/')[1],base='/';
if(/\.github\.io$/.test(h)&&seg&&seg.indexOf('.')<0&&seg!==h.split('.')[0])base='/'+seg+'/';
document.getElementById('home').href=base;
var l=document.querySelectorAll('.sc');for(var i=0;i<l.length;i++){var a=l[i].getAttribute('href');l[i].href=base+(a==='#'?'':a)}})();
</script>
</body>
</html>
